<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои работы — DouleRs.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --bg-2:#121216; --card:#16161b; --text:#ececf1;
    --muted:#8b8b96; --accent:#7c5cff; --accent-2:#4dd4ff;
    --border:#23232b; --radius:18px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); padding:40px 0; min-height:100vh;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  
  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 50px; }
  .back-link { color: var(--muted); font-size: .9rem; display: inline-flex; align-items: center; gap: 8px; transition: .3s; font-weight: 500; }
  .back-link:hover { color: var(--accent-2); }
  .logo { font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.15rem; }
  .logo span { background: linear-gradient(90deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; color:transparent; }

  .sec-label{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-2);margin-bottom:14px;font-weight:600}
  .sec-title{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.9rem,4vw,2.9rem);letter-spacing:-.02em;font-weight:700; margin-bottom: 20px;}
  
  .portfolio-disclaimer { color: var(--muted); font-size: .95rem; line-height: 1.65; margin-bottom: 40px; padding: 16px 20px; background: rgba(124, 92, 255, 0.06); border-left: 3px solid var(--accent); border-radius: 0 12px 12px 0; max-width: 720px; }
  .portfolio-disclaimer strong { color: var(--text); font-weight: 600; }

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:40px}
  .filter{padding:9px 20px;border-radius:999px;font-size:.85rem;font-weight:500;background:transparent;color:var(--muted);border:1px solid var(--border);cursor:pointer;transition:.25s;font-family:inherit}
  .filter:hover{color:var(--text);border-color:#3a3a45;transform:translateY(-1px)}
  .filter.active{background:var(--text);color:var(--bg);border-color:var(--text)}

  /* ВЕРНУЛИ СТАНДАРТНУЮ СЕТКУ */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
  .card{
    position:relative;border-radius:var(--radius);overflow:hidden;
    background:var(--card);border:1px solid var(--border);cursor:pointer;
    transition:.4s cubic-bezier(.2,.8,.2,1);
  }
  .card:hover{transform:translateY(-6px);border-color:#3a3a45;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .card-img{aspect-ratio:4/3;overflow:hidden;position:relative;background:linear-gradient(135deg,#1c1c24,#2a2a36)}
  .card-img img{width:100%;height:100%;object-fit:cover;transition:.6s cubic-bezier(.2,.8,.2,1)}
  .card:hover .card-img img{transform:scale(1.06)}
  .card-body{padding:22px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .card-cat{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2);font-weight:600;margin-bottom:6px}
  .card-title{font-family:'Space Grotesk',sans-serif;font-size:1.2rem;font-weight:600}
  .card-arrow{width:38px;height:38px;border-radius:50%;flex-shrink:0;border:1px solid var(--border);display:grid;place-items:center;transition:.3s;color:var(--muted)}
  .card:hover .card-arrow{background:linear-gradient(120deg,var(--accent),var(--accent-2));border-color:transparent;color:#0a0a0c;transform:rotate(-45deg)}

  /* МОДАЛКА */
  .modal{position:fixed;inset:0;z-index:200;display:none;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);padding:24px;overflow-y:auto}
  .modal.open{display:flex;align-items:center;justify-content:center}
  .modal-box{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius);max-width:820px;width:100%;overflow:hidden;animation:modalIn .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
  .modal-img{aspect-ratio:16/9;overflow:hidden;background:#1c1c24}
  .modal-img img{width:100%;height:100%;object-fit:cover}
  .modal-content{padding:32px}
  .modal-content h3{font-family:'Space Grotesk',sans-serif;font-size:1.7rem;margin-bottom:8px}
  .modal-content .card-cat{margin-bottom:16px}
  .modal-content p{color:var(--muted);margin-bottom:24px}
  .modal-close{position:absolute;top:24px;right:24px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:1.4rem;cursor:pointer;display:grid;place-items:center;transition:.2s;z-index:10}
  .modal-close:hover{background:rgba(255,255,255,.18);transform:rotate(90deg)}
  
  .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 28px;border-radius:999px;font-weight:600;font-size:.95rem;transition:.25s;cursor:pointer;border:none;font-family:inherit;}
  .btn-primary{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#0a0a0c}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(124,92,255,.35)}

  @media(max-width:820px){
    .grid{grid-template-columns:1fr}
    .topbar { flex-direction: column; align-items: flex-start; gap: 20px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="index.html" class="back-link">← Вернуться на главную</a>
    <a href="index.html" class="logo">DouleRs<span>.com</span></a>
  </div>

  <div class="sec-label">Портфолио</div>
  <h2 class="sec-title">Избранные работы</h2>
  <p class="portfolio-disclaimer">
    <strong>Важное уточнение:</strong> это личные проекты, сделанные для портфолио, они не выставлялись на продажу. Вы можете заказать у меня сайт по аналогичным наброскам из этого портфолио — я адаптирую дизайн и функционал под ваши задачи.
  </p>

  <div class="filters" id="filters">
    <button class="filter active" data-cat="all">Все</button>
    <button class="filter" data-cat="landing">Лендинг (Сайт-визитка)</button>
    <button class="filter" data-cat="multipage">Многостраничные</button>
    <button class="filter" data-cat="redesign">Редизайн</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- МОДАЛКА -->
<div class="modal" id="modal">
  <button class="modal-close" id="modalClose">×</button>
  <div class="modal-box" id="modalBox"></div>
</div>

<script>
  const projects = [
    { cat: 'landing', title: 'Зерно · Кофейня', desc: 'Уютный, светлый лендинг для кофейни. Кремовые тона, аккуратные карточки меню, галерея и плейсхолдеры под фото.', img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'%3E%3Crect width='800' height='600' fill='%23FAF3E8'/%3E%3Ccircle cx='400' cy='300' r='220' fill='%23F0E1CF'/%3E%3Ctext x='400' y='330' font-family='sans-serif' font-size='85' font-weight='bold' fill='%233D2415' text-anchor='middle'%3EЗЕРНО%3C/text%3E%3C/svg%3E", link: 'zerno.html' },
    { cat: 'landing', title: 'Бритва · Барбершоп', desc: 'Тёмный, брутальный лендинг с характером. Индустриальный стиль, сетка услуг и карточки мастеров.', img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'%3E%3Crect width='800' height='600' fill='%230E0E10'/%3E%3Cpath d='M0 600 L800 0 L800 600 Z' fill='%231A1A1E'/%3E%3Ctext x='400' y='330' font-family='sans-serif' font-size='85' font-weight='bold' fill='%23D4A259' text-anchor='middle'%3EБРИТВА%3C/text%3E%3C/svg%3E", link: 'britva.html' },
    { cat: 'landing', title: 'Терруар · Винный бар', desc: 'Редакционный стиль для винного бара. Глубокие зелёные тона, крупные серифные заголовки и акцент на атмосферу.', img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'%3E%3Crect width='800' height='600' fill='%23121310'/%3E%3Crect x='150' y='150' width='500' height='300' fill='none' stroke='%23C9A86A' stroke-width='2'/%3E%3Ctext x='400' y='330' font-family='serif' font-size='85' font-weight='bold' fill='%23C9A86A' text-anchor='middle'%3EТЕРРУАР%3C/text%3E%3C/svg%3E", link: 'terroir.html' },
    { cat: 'multipage', title: 'LUMEN · Фотограф', desc: 'Многостраничный сайт (4 страницы). Минимализм, галерейный стиль, фильтры портфолио и плавные переходы.', img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'%3E%3Crect width='800' height='600' fill='%23F7F5F1'/%3E%3Ccircle cx='400' cy='300' r='180' fill='none' stroke='%231C1A17' stroke-width='2'/%3E%3Ctext x='400' y='330' font-family='sans-serif' font-size='75' font-weight='300' letter-spacing='15' fill='%231C1A17' text-anchor='middle'%3ELUMEN%3C/text%3E%3C/svg%3E", link: 'photographer/index.html' },
    { cat: 'redesign', title: 'Рогалик · Редизайн', desc: 'Кейс редизайна: как сайт из 2010-х превратился в современную пекарню. Встроенный переключатель ДО/ПОСЛЕ.', img: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600'%3E%3Crect width='800' height='600' fill='%23FBF3E7'/%3E%3Ccircle cx='200' cy='150' r='120' fill='%23F0E1CF'/%3E%3Ccircle cx='650' cy='500' r='180' fill='%23F0E1CF'/%3E%3Ctext x='400' y='330' font-family='sans-serif' font-size='85' font-weight='bold' fill='%23C47F3B' text-anchor='middle'%3EРОГАЛИК%3C/text%3E%3C/svg%3E", link: 'pekar.html' }
  ];
  const catNames = { landing: 'Лендинг (Сайт-визитка)', multipage: 'Многостраничный', redesign: 'Редизайн' };
  const grid = document.getElementById('grid');
  const modal = document.getElementById('modal');
  const modalBox = document.getElementById('modalBox');

  function render(filter='all'){
    grid.innerHTML = '';
    projects.forEach((p) => {
      if(filter !== 'all' && p.cat !== filter) return;
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <div class="card-img"><img src="${p.img}" alt="${p.title}" loading="lazy"></div>
        <div class="card-body"><div><div class="card-cat">${catNames[p.cat] || ''}</div><div class="card-title">${p.title}</div></div><div class="card-arrow">↗</div></div>
      `;
      el.addEventListener('click', ()=> openModal(p));
      grid.appendChild(el);
    });
  }

  document.getElementById('filters').addEventListener('click', e=>{
    const btn = e.target.closest('.filter');
    if(!btn) return;
    document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.cat);
  });

  function openModal(p){
    modalBox.innerHTML = `
      <div class="modal-img"><img src="${p.img}" alt="${p.title}"></div>
      <div class="modal-content">
        <div class="card-cat">${catNames[p.cat] || ''}</div>
        <h3>${p.title}</h3>
        <p>${p.desc || ''}</p>
        <a href="${p.link}" target="_blank" class="btn btn-primary">Открыть сайт →</a>
      </div>`;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  
  document.getElementById('modalClose').addEventListener('click', ()=>{ modal.classList.remove('open'); document.body.style.overflow = ''; });
  modal.addEventListener('click', e=>{ if(e.target === modal){ modal.classList.remove('open'); document.body.style.overflow = ''; } });

  render();
</script>
</body>
</html>
